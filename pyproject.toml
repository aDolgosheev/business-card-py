[project]
name = "business-card"
version = "0.1.0"
description = "Сайт-визитка Александра Долгошеева"
readme = "README.md"
authors = [
    { name = "Aleksandr Dolgosheev", email = "al.dolgosheev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "uvicorn[standard]>=0.54.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.14.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
